#
# BPI-R4 OpenWrt 自动编译工作流
#
# 固件源码 : https://github.com/chasey-dev/immortalwrt-mt798x-rebase (ImmortalWrt 25.12 + MTK 官方 Feeds)
# 架构参考 : P3TERX/Actions-OpenWrt
#
# 触发方式 :
#   1. 每周一北京时间 11:00 自动编译 (UTC 03:00)
#   2. 手动触发 (Actions -> Run workflow)，可选"忽略缓存强制全量重编"和"失败时 SSH 调试"
#
# 编译产物 (Release 下载):
#   *-sysupgrade.itb          已装系统在线升级用
#   *-sdcard.img.gz           SD 卡一键启动镜像 (含引导+固件，新手推荐)
#   *-emmc-preloader/fip      eMMC 引导文件
#   *-snand-preloader/fip     SPI NAND 引导文件
#

name: Build BPI-R4 OpenWrt

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '忽略缓存，强制全量重编'
        required: false
        default: false
        type: boolean
      debug_ssh:
        description: '编译失败时进入 SSH 调试会话'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12
  CONFIG_FILE: config/bpi-r4.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: build-bpi-r4
  cancel-in-progress: true

jobs:

  # ============================================================
  # 单 Job 编译：工具链缓存命中时跳过工具链编译，直接编译固件
  # 旧方案拆分两个 Job，每个都重复 clone+feeds 耗时但无产出，
  # 合并后只需一次 clone+feeds，缓存命中时省掉整个工具链编译阶段。
  # ============================================================
  build:
    name: 编译 BPI-R4 固件
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          # 安装 LLVM 工具链（含 llvm-strip/clang），dae/daed 的 eBPF (bpf2go) 编译需要
          # OpenWrt bpf.mk 的 find-llvm-tool 找不到 llvm-strip 时回退为字面量
          # "llvm-strip-not-found"，导致 go generate 失败、eBPF 代码未生成
          sudo -E apt-get -qq install llvm clang
          # 创建无版本号软链接，确保 bpf.mk 的 command -v llvm-strip 能命中
          for t in llvm-strip clang llc llvm-dis opt; do
            sudo ln -sf "$(command -v $t || command -v $t-18 || command -v $t-17 || command -v $t-16 || command -v $t-15 || command -v $t-14)" "/usr/local/bin/$t" 2>/dev/null || true
          done
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -hT

      - name: 克隆固件源码
        working-directory: /workdir
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 记录源码版本
        id: src
        run: |
          cd /workdir/openwrt
          SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "源码版本: $SHA ($(git log -1 --format=%cd --date=iso))"

      - name: 注入自定义软件源 (diy-part1)
        run: |
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 恢复工具链缓存
        id: cache-toolchain
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
          key: toolchain-v3-${{ steps.src.outputs.sha }}
          restore-keys: toolchain-v3-

      - name: 修复缓存时间戳（缓存命中时）
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          cd openwrt
          # actions/cache 恢复时文件 mtime 被重置为恢复时刻，且恢复集内
          # 各文件 mtime 顺序不确定。OpenWrt 的 timestamp.pl 要求 stamp
          # 文件必须是所有被扫描路径中最新的，否则判定需要重编。
          #
          # 修复策略：
          #   1) 把源码目录 tools/ toolchain/ 的 mtime 设旧（2020），
          #      确保它们不会比恢复的 stamp 新
          #   2) 把所有 stamp 文件 touch 到当前时刻，确保它们是绝对最新的
          find tools toolchain -exec touch -d "2020-01-01" {} + 2>/dev/null || true
          find staging_dir build_dir -path '*/stamp/*' -type f -exec touch {} + 2>/dev/null || true
          echo "✅ 缓存时间戳已修复（源码设旧 + stamp 设新）"

      - name: 编译工具链（缓存未命中时）
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd openwrt
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig
          make tools/install toolchain/install -j$(nproc) || make tools/install toolchain/install -j1 V=s
          df -hT

      - name: 加载固件配置与预置文件
        run: |
          [ -e files ] && cp -rf files openwrt/files && rm -f openwrt/files/.gitkeep
          cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH

      - name: 恢复 Go 构建缓存
        id: cache-gobuild
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v4
        with:
          path: /workdir/openwrt/tmp/go-build
          # Xray/sing-box/AdGuardHome/mosdns 等大 Go 包的增量编译缓存
          # 缓存后单次编译可省 20-40 分钟 Go 编译时间
          key: go-build-v3-${{ github.run_id }}
          restore-keys: go-build-v3-

      - name: 应用编译前定制 (diy-part2)
        run: |
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成最终配置并校验
        run: |
          cd openwrt
          make defconfig
          # 核心配置校验（目标设备 + Passwall）
          check_config() {
            grep -q "^$1=y" .config || { echo "::error::关键配置缺失: $1"; exit 1; }
          }
          check_config CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4
          check_config CONFIG_PACKAGE_luci-app-passwall
          check_config CONFIG_PACKAGE_luci-app-adguardhome
          check_config CONFIG_PACKAGE_adguardhome
          grep -q "^CONFIG_PACKAGE_xray-core=y" .config \
            && echo "✅ Passwall (Xray) 配置校验通过" \
            || echo "::warning::Xray 内核未选中，请检查 passwall feeds 是否更新"
          # 自定义包校验（扫描 + 来源防顶替 + 选中），清单: scripts/custom-packages.list
          bash $GITHUB_WORKSPACE/scripts/verify-custom-packages.sh $GITHUB_WORKSPACE/scripts/custom-packages.list

      - name: 上传最终 .config (快照)
        uses: actions/upload-artifact@v4
        with:
          name: final-defconfig
          path: openwrt/.config

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j$(nproc)
          # 串行补漏：并行下载的竞态遗漏在此统一校验补齐
          make download -j1
          # 清理下载失败残留的假文件（<1KB，如 404 HTML 页）。
          # P0 修复（2026-09-28）：排除 go-mod-cache —— Go 模块的 .mod/.info
          # 元数据与小源文件常小于 1KB，曾被此规则误删导致 go-mod-cache
          # 反复"损坏"（AdGuardHome 报 no required module 的真正元凶）。
          # 目录条目本身 inode 也 <1KB，加 -type f 只处理普通文件。
          find dl -name go-mod-cache -prune -o -type f -size -1024c -print -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) 线程编译开始: $(date)"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          df -hT

      # ============================================================
      # 缓存保存与清理（拆分 restore/save 策略）
      #
      # 编译成功后：
      #   1. 清理旧缓存（删除非本次 run_id 的 go-build + 非当前 SHA 的 toolchain）
      #   2. 保存本次缓存（go-build → toolchain）
      # 确保任何时刻每种缓存只保留 1 个条目，不超过 10GB 限额
      # ============================================================

      - name: 清理旧缓存（只保留本次运行）
        if: ${{ !inputs.clean_cache && steps.compile.outputs.status == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          echo "=== 清理旧缓存（保留 run_id=$RUN_ID + SHA=$SRC_SHA）==="
          # 获取所有缓存条目，逐条判断是否保留
          gh cache list --repo "$GITHUB_REPOSITORY" --json id,key -L 100 \
            | python3 -c \
          "import sys, json, os
          data = json.load(sys.stdin)
          run_id = os.environ['RUN_ID']
          sha = os.environ['SRC_SHA']
          for c in data:
              key = c.get('key', '')
              cid = c.get('id', '')
              # 保留本次运行创建的缓存
              if run_id in key:
                  continue
              # 保留当前 SHA 的工具链缓存
              if key.startswith('toolchain-v3-') and sha in key:
                  continue
              # 其余全部删除（旧 go-build、旧 SHA toolchain、v1/v2 残留）
              print(cid)
          " | while read cid; do
              gh cache delete "$cid" --repo "$GITHUB_REPOSITORY" \
                && echo "  已删除 id=$cid" \
                || echo "  删除失败 id=$cid"
            done
          echo "=== 清理完成，当前缓存列表 ==="
          gh cache list --repo "$GITHUB_REPOSITORY" -L 20

      - name: 保存 Go 构建缓存
        if: ${{ !inputs.clean_cache && steps.compile.outputs.status == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: /workdir/openwrt/tmp/go-build
          key: go-build-v3-${{ github.run_id }}

      - name: 保存工具链缓存
        if: ${{ !inputs.clean_cache && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.compile.outputs.status == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
          key: toolchain-v3-${{ steps.src.outputs.sha }}

      - name: SSH 调试会话 (仅失败且手动开启时)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.debug_ssh
        uses: mxschmitt/action-tmate@v3

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "===== 固件产物 ====="
          ls -lh
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_BPI-R4_firmware
          path: ${{ env.FIRMWARE }}
          # 固件已同时发布到 Release（永久保留 4 版），artifact 仅作中转
          # 快照，缩短保留期节省仓库配额（默认 90 天）
          retention-days: 7

      - name: 生成 Release 信息
        id: tag
        if: steps.organize.outputs.status == 'success'
        run: |
          echo "release_tag=BPI-R4_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          touch release.txt
          echo "## BPI-R4 固件 (ImmortalWrt 25.12 + MTK Feeds)" >> release.txt
          echo "" >> release.txt
          echo "**源码版本**: \`${{ steps.src.outputs.sha }}\`" >> release.txt
          echo "**编译时间**: $(date +"%Y-%m-%d %H:%M") CST" >> release.txt
          # P4 维护性：插件数量自动统计（替代硬编码清单，加包免更此处）
          PKG_COUNT=$(grep -vcE '^[[:space:]]*(#|$)' $GITHUB_WORKSPACE/scripts/custom-packages.list)
          echo "**内置插件**: 共 ${PKG_COUNT} 个自定义插件（完整清单见仓库 README）—— Passwall (Xray/sing-box/Hysteria)、AdGuard Home、dae/honk eBPF 透明代理、mosdns DNS 分流、ZeroTier、EasyTier、AI 模型网关、QosMate、OpenList2 等" >> release.txt
          echo "" >> release.txt
          echo "### 固件文件说明" >> release.txt
          echo "| 文件 | 用途 |" >> release.txt
          echo "|---|---|" >> release.txt
          echo "| \`*-sdcard.img.gz\` | 写入 SD 卡直接启动（首次安装推荐） |" >> release.txt
          echo "| \`*-sysupgrade.itb\` | 已装系统的在线升级（LuCI/命令行） |" >> release.txt
          echo "| \`*-emmc-preloader.bin\` + \`*-emmc-bl31-uboot.fip\` | eMMC 引导写入 |" >> release.txt
          echo "| \`*-snand-preloader.bin\` + \`*-snand-bl31-uboot.fip\` | SPI NAND 引导写入 |" >> release.txt
          echo "" >> release.txt
          echo "> 默认 IP: 192.168.10.1，账号 root / 无密码" >> release.txt

      - name: 发布固件到 Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: 清理旧的 workflow 记录
        uses: Mattraks/delete-workflow-runs@main
        if: steps.compile.outputs.status == 'success'
        with:
          retain_days: 0
          keep_minimum_runs: 4

      - name: 清理旧的 Releases (保留最近 4 个)
        uses: dev-drprasad/delete-older-releases@master
        if: steps.compile.outputs.status == 'success'
        with:
          keep_latest: 4
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
